<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prode Mundial 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1f2630; --line:#2d333b;
  --text:#e6edf3; --mute:#8b949e; --acc:#58a6ff; --acc2:#3fb950;
  --warn:#d29922; --bad:#f85149; --real:#3fb950; --pred:#58a6ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.4}
a{color:var(--acc)}
button{font-family:inherit;cursor:pointer}
input,select,button{font-family:inherit;font-size:14px}
input[type=number],input[type=text],input[type=password],select{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;
}
input[type=number]{width:48px;text-align:center}
input:disabled{opacity:.55}
.btn{background:var(--acc);color:#0d1117;border:none;border-radius:6px;padding:8px 14px;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
header{
  position:sticky;top:0;z-index:10;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
header .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mute)}
header .who b{color:var(--text)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:transparent;color:var(--mute);border:none;padding:8px 14px;border-radius:6px;font-weight:600}
nav.tabs button.on{background:var(--panel2);color:var(--text)}
nav.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
nav.subtabs button{background:var(--panel);color:var(--mute);border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-size:13px}
nav.subtabs button.on{background:var(--acc);color:#0d1117;border-color:var(--acc)}
main{padding:16px;max-width:1200px;margin:0 auto}
.section{margin-bottom:22px}
.section h2{font-size:16px;margin:0 0 10px 0;color:var(--text);font-weight:700}
.section h3{font-size:14px;margin:14px 0 6px 0;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.match{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:none}
.match .t{display:flex;align-items:center;gap:6px;min-width:0}
.match .t.right{justify-content:flex-end;text-align:right}
.match .t img{width:22px;height:16px;object-fit:cover;border-radius:2px;flex-shrink:0;background:var(--panel2)}
.match .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match .info{font-size:11px;color:var(--mute);text-align:center;min-width:90px}
.match .score{display:flex;align-items:center;gap:4px;white-space:nowrap}
.match .pen{font-size:11px;color:var(--warn);margin-left:4px}
.match.real{border-left:3px solid var(--real);padding-left:6px;background:rgba(63,185,80,.04)}
.match.pred{border-left:3px solid var(--pred);padding-left:6px;background:rgba(88,166,255,.04)}
.match .pts{font-size:11px;color:var(--acc2);font-weight:700;min-width:28px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr.first td{color:var(--acc2)}
tr.second td{color:var(--acc)}
tr.third td{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:760px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .match{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .match .info{grid-column:1/3;order:-1;text-align:left}
  .match .score{grid-column:1/3;justify-content:center;order:3}
  .match .pts{grid-column:1/3;order:4;text-align:center}
}
.legend{font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px 0}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lock{font-size:11px;color:var(--warn);background:rgba(210,153,34,.1);padding:3px 8px;border-radius:4px;border:1px solid rgba(210,153,34,.3);display:inline-block;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{color:var(--mute);font-size:12px;min-width:120px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:380px;width:90%}
.modal h2{margin:0 0 12px 0}
.modal .row{margin:10px 0}
.modal input{width:100%;padding:10px}
.modal .btn{width:100%;margin-top:14px;padding:12px}
.error{color:var(--bad);font-size:13px;margin:6px 0}
.ok{color:var(--acc2);font-size:13px;margin:6px 0}
.bracket-grid{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:8px;overflow-x:auto;padding-bottom:8px}
.bracket-col{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.bracket-col h4{font-size:11px;color:var(--mute);margin:0 0 4px 0;text-transform:uppercase;letter-spacing:.5px;text-align:center}
.bmatch{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px;min-height:50px}
.bmatch.real{border-color:var(--real)}
.bmatch.pred{border-color:var(--pred)}
.bmatch .br{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:2px 0}
.bmatch .br img{width:16px;height:12px;object-fit:cover;border-radius:1px;flex-shrink:0}
.bmatch .br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bmatch .br input{width:34px;padding:2px 4px;font-size:12px}
.bmatch .mid{font-size:10px;color:var(--mute);text-align:center;padding-top:2px;border-top:1px dashed var(--line);margin-top:2px}
.standings-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.standings-pair .col h5{font-size:11px;color:var(--mute);margin:0 0 4px 0;text-transform:uppercase}
.standings-pair .col.real h5{color:var(--real)}
.standings-pair .col.pred h5{color:var(--pred)}
.adminlist{font-size:12px;color:var(--mute);margin-top:6px}
.adminlist b{color:var(--text)}
.muted{color:var(--mute)}
.totalpts{font-size:24px;font-weight:800;color:var(--acc2)}
.players-list{font-size:13px}
.players-list .p{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.players-list .p:last-child{border:none}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:11px;color:var(--mute);margin-right:4px}
.tag.real{color:var(--real);border-color:var(--real)}
.tag.pred{color:var(--pred);border-color:var(--pred)}
.warn-banner{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);color:var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.day-header{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px 0;font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--line)}
</style>
</head>

<div id="loadingScreen" class="modal-bg" style="display:flex">
  <div class="modal" style="text-align:center">
    <h2>Prode Mundial 2026</h2>
    <p class="muted">Conectando con la nube...</p>
  </div>
</div>

<div id="login" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>Prode Mundial 2026</h2>
    <div id="loginStep1">
      <div class="row"><input id="loginName" placeholder="Tu nombre" autocomplete="off"></div>
      <button class="btn" onclick="loginStep1()">Continuar</button>
      <div id="loginErr" class="error" style="display:none"></div>
    </div>
    <div id="loginStep2" style="display:none">
      <p class="muted" id="loginMsg"></p>
      <div class="row"><input id="loginPwd" type="password" placeholder="Clave" autocomplete="off"></div>
      <button class="btn" onclick="loginStep2()">Entrar</button>
      <div id="loginErr2" class="error" style="display:none"></div>
      <button class="btn sec" style="margin-top:8px" onclick="resetLogin()">Volver</button>
    </div>
  </div>
</div>

<header>
  <h1>Prode Mundial 2026</h1>
  <div class="who">
    <span>👤 <b id="whoami">—</b></span>
    <button class="btn sec" onclick="logout()" style="padding:4px 10px;font-size:12px">Cambiar usuario</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="pred" class="on">Mis Predicciones</button>
  <button data-tab="fixture">Fixture</button>
  <button data-tab="groups">Grupos</button>
  <button data-tab="ranking">Ranking</button>
  <button data-tab="admin">Admin</button>
</nav>

<main>

/* ============ HASH ============ */
function rndSalt(){return Math.random().toString(36).slice(2,10)}
function hashPwd(pwd,salt){
  // Simple deterministic hash (FNV-1a 32-bit, hex). Not crypto-strong, OK for prode.
  const s = salt+'|'+pwd;
  let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0;}
  return h.toString(16).padStart(8,'0');
}

/* ============ NAME MATCHING ============ */
function normalizeName(s){
  return s.trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9\s]/g,'').trim();
}
function nameWords(s){ return normalizeName(s).split(/\s+/).filter(w=>w.length>0); }
function wordsClose(a,b){
  // Same word, OR share a prefix of length >= min(len)-1 (handles 1-char typos at end)
  if(a===b) return true;
  const minLen=Math.min(a.length,b.length);
  if(minLen<4) return false;
  const prefixNeeded=minLen-1;
  let common=0; for(let i=0;i<minLen;i++){if(a[i]===b[i])common++;else break;}
  return common>=prefixNeeded;
}
function namesMatch(a,b){
  if(!a||!b) return false;
  const wa=nameWords(a), wb=nameWords(b);
  return wa.some(wa_w=>wb.some(wb_w=>wordsClose(wa_w,wb_w)));
}
function findMatchingGoals(playerName, pgGoals){
  if(!playerName) return 0;
  for(const key of Object.keys(pgGoals||{})){
    if(namesMatch(playerName,key)) return pgGoals[key]||0;
  }
  return 0;
}

/* ============ STANDINGS ENGINE ============ */
function emptyStats(){return {pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,dg:0,pts:0}}
// srcFn(matchId) -> {h,a} or null
function calcStandings(grp,srcFn){
  const teams = GROUPS[grp];
  const st = {};
  teams.forEach(t=>st[t]=emptyStats());
  MATCHES.filter(m=>m.grp===grp).forEach(m=>{
    const r = srcFn(m.id);
    if(!r||r.h==null||r.a==null) return;
    const A = st[m.t1], B = st[m.t2];
    A.pj++; B.pj++;
    A.gf+=r.h; A.gc+=r.a; B.gf+=r.a; B.gc+=r.h;
    if(r.h>r.a){A.pg++;A.pts+=3;B.pp++}
    else if(r.h<r.a){B.pg++;B.pts+=3;A.pp++}
    else {A.pe++;B.pe++;A.pts++;B.pts++}
    A.dg=A.gf-A.gc; B.dg=B.gf-B.gc;
  });
  // sort by pts, dg, gf
  const arr = teams.map(t=>({t,...st[t]}));
  arr.sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.t.localeCompare(b.t));
  return arr;
}
function realSrc(id){const r=real.m[id]; return (r&&r.h!=null&&r.a!=null)?r:null}

/* ---- Best thirds (auto-asignación a slots R32 "3:XYZ") ---- */
// Devuelve los 12 terceros ordenados por pts/dg/gf (solo grupos completos).
function calcBestThirds(srcFn){
  const thirds = [];
  GROUP_LETTERS.forEach(grp=>{
    const done = MATCHES.filter(m=>m.grp===grp).every(m=>srcFn(m.id));
    if(!done) return;
    const st = calcStandings(grp, srcFn);
    if(st[2]) thirds.push({grp, ...st[2]});
  });
  thirds.sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.grp.localeCompare(b.grp));
  return thirds;
}
// Devuelve mapping {slotKey:'3:ABCDF' -> groupLetter}. Top-8 mejores terceros,
// asigna a slots con backtracking para garantizar matching completo (la grilla FIFA
// está diseñada para que siempre exista una asignación válida).
function assignThirds(srcFn){
  const thirds = calcBestThirds(srcFn);
  if(thirds.length<8) return {};
  const top8Grps = thirds.slice(0,8).map(t=>t.grp);
  // Slots que requieren un 3° (en orden de match id)
  const slots = [];
  [74,77,79,80,81,82,85,87].forEach(id=>{
    const m = MATCH_BY_ID[id]; if(!m) return;
    [m.s1,m.s2].forEach(s=>{ if(s.startsWith('3:')) slots.push({key:s, allowed:new Set(s.slice(2).split(''))}); });
  });
  // Backtracking: asignar cada slot un grupo de top8Grps sin repetir, respetando allowed
  const out = {};
  const used = new Set();
  function dfs(i){
    if(i===slots.length) return true;
    const {key, allowed} = slots[i];
    for(const g of top8Grps){
      if(used.has(g)) continue;
      if(!allowed.has(g)) continue;
      out[key] = g; used.add(g);
      if(dfs(i+1)) return true;
      delete out[key]; used.delete(g);
    }
    return false;
  }
  dfs(0);
  return out;
}

/* ---- Puntos por partido (para mostrar en cada row) ---- */
// Devuelve {total, detail} o null si no se puede calcular
function matchPoints(name, id){
  const m = MATCH_BY_ID[id]; if(!m) return null;
  const pr = preds[name]&&preds[name].m&&preds[name].m[id];
  const rr = real.m[id];
  if(!pr||pr.h==null||pr.a==null||!rr||rr.h==null||rr.a==null) return null;
  let pts = 0; const parts = [];
  if(m.grp){
    if(pr.h===rr.h && pr.a===rr.a){pts+=3; parts.push('exacto +3');}
    else if(Math.sign(pr.h-pr.a)===Math.sign(rr.h-rr.a)){pts+=1; parts.push('signo +1');}
  } else if(m.stg==='R32'){
    if(pr.h===rr.h && pr.a===rr.a){pts+=3; parts.push('exacto +3');}
    else if(Math.sign(pr.h-pr.a)===Math.sign(rr.h-rr.a)){pts+=1; parts.push('signo +1');}
    const t1R=resolveTeamReal(m.s1),t2R=resolveTeamReal(m.s2);
    const t1P=resolveTeamPred(m.s1,name),t2P=resolveTeamPred(m.s2,name);
    if(t1R&&t2R&&t1P&&t2P){
      let rw,pw;
      if(rr.h>rr.a) rw=t1R; else if(rr.a>rr.h) rw=t2R; else rw=(rr.ph>rr.pa?t1R:t2R);
      if(pr.h>pr.a) pw=t1P; else if(pr.a>pr.h) pw=t2P; else pw=(pr.ph>pr.pa?t1P:t2P);
      if(rw===pw){pts+=1; parts.push('avance +1');}
    }
  } else {
    // R16/QF/SF/TP/FIN: 5 exact, 2 winner, +1 winner advances (except FIN/TP)
    if(pr.h===rr.h && pr.a===rr.a){pts+=5; parts.push('exacto +5');}
    const t1R=resolveTeamReal(m.s1),t2R=resolveTeamReal(m.s2);
    const t1P=resolveTeamPred(m.s1,name),t2P=resolveTeamPred(m.s2,name);
    let rw=null,pw=null;
    if(t1R&&t2R){
      if(rr.h>rr.a) rw=t1R; else if(rr.a>rr.h) rw=t2R; else if(rr.ph!=null&&rr.pa!=null) rw=(rr.ph>rr.pa?t1R:t2R);
    }
    if(t1P&&t2P){
      if(pr.h>pr.a) pw=t1P; else if(pr.a>pr.h) pw=t2P; else if(pr.ph!=null&&pr.pa!=null) pw=(pr.ph>pr.pa?t1P:t2P);
    }
    if(rw&&pw&&rw===pw){
      pts+=2; parts.push('ganador +2');
      if(m.stg!=='FIN'&&m.stg!=='TP'){pts+=1; parts.push('avance +1');}
    }
  }
  return {total: pts, detail: parts.join(', ')||'sin puntos'};
}

/* ============ SLOT RESOLVERS ============ */
// resolveTeamReal(slot): only real data; null if not yet known
function resolveTeamReal(slot){
  if(!slot) return null;
  if(/^[12]([A-L])$/.test(slot)){
    const grp = slot[1], pos = +slot[0]-1;
    const done = MATCHES.filter(m=>m.grp===grp).every(m=>realSrc(m.id));
    if(!done) return null;
    return calcStandings(grp, realSrc)[pos].t;
  }
  if(slot.startsWith('3:')){
    const assignment = assignThirds(realSrc);
    const grp = assignment[slot];
    if(!grp) return null;
    return calcStandings(grp, realSrc)[2].t;
  }
  if(/^W(\d+)$/.test(slot) || /^L(\d+)$/.test(slot)){
    const id = +slot.slice(1);
    const m = MATCH_BY_ID[id];
    const r = realSrc(id);
    if(!r) return null;
    const t1 = resolveTeamReal(m.s1||m.t1), t2 = resolveTeamReal(m.s2||m.t2);
    if(!t1||!t2) return null;
    let winner;
    if(r.h>r.a) winner = t1;
    else if(r.a>r.h) winner = t2;
    else { if(r.ph==null||r.pa==null) return null; winner = r.ph>r.pa ? t1 : t2; }
    return slot.startsWith('W') ? winner : (winner===t1?t2:t1);
  }
  return null;
}
// resolveTeamPred(slot,name): user's predicted progression
function resolveTeamPred(slot,name){
  if(!slot) return null;
  const p = preds[name];
  if(!p) return null;
  if(/^[12]([A-L])$/.test(slot)){
    const grp = slot[1], pos = +slot[0]-1;
    return calcStandings(grp, predSrc(name))[pos].t;
  }
  if(slot.startsWith('3:')){
    const assignment = assignThirds(predSrc(name));
    const grp = assignment[slot];
    if(!grp) return null;
    return calcStandings(grp, predSrc(name))[2].t;
  }
  if(/^W(\d+)$/.test(slot) || /^L(\d+)$/.test(slot)){
    const id = +slot.slice(1);
    const m = MATCH_BY_ID[id];
    const r = p.m && p.m[id];
    if(!r||r.h==null||r.a==null) return null;
    const t1 = resolveTeamPred(m.s1||m.t1,name), t2 = resolveTeamPred(m.s2||m.t2,name);
    if(!t1||!t2) return null;
    let winner;
    if(r.h>r.a) winner = t1;
    else if(r.a>r.h) winner = t2;
    else { if(r.ph==null||r.pa==null) return null; winner = r.ph>r.pa ? t1 : t2; }
    return slot.startsWith('W') ? winner : (winner===t1?t2:t1);
  }
  return null;
}
// For display in "Mis Predicciones": real if available, else predicted
function resolveSlotDisplay(slot,name){
  const real_ = resolveTeamReal(slot);
  if(real_) return {team:real_,source:'real'};
  const pred = resolveTeamPred(slot,name);
  return pred ? {team:pred,source:'pred'} : null;
}

/* ============ SCORING ============ */
function calcBreakdown(name){
  const b = {esp:0,grp:0,r32:0,r16:0,qf:0,sf:0,fin:0};
  const p = preds[name];
  if(!p) return b;
  // ---- ESPECIALES ----
  // 5 - goleador, 3 - masGoleador, 3 - masGoleado, 3 - masExpulsados
  // 10 - lesionado, 15 - campeón, 10 - subcampeón, 5 - tercero
  const sp = p.sp||{}, rsp = realSp||{};
  if(sp.goleador && rsp.goleador && namesMatch(sp.goleador, rsp.goleador)) b.esp+=5;
  if(sp.masGoleador && rsp.masGoleador && sp.masGoleador===rsp.masGoleador) b.esp+=3;
  if(sp.masGoleado && rsp.masGoleado && sp.masGoleado===rsp.masGoleado) b.esp+=3;
  if(sp.masExpulsados && rsp.masExpulsados && sp.masExpulsados===rsp.masExpulsados) b.esp+=3;
  if(sp.lesionado && rsp.lesionado && namesMatch(sp.lesionado, rsp.lesionado)) b.esp+=10;
  if(sp.campeon && rsp.campeon && sp.campeon===rsp.campeon) b.esp+=15;
  if(sp.subcampeon && rsp.subcampeon && sp.subcampeon===rsp.subcampeon) b.esp+=10;
  if(sp.tercero && rsp.tercero && sp.tercero===rsp.tercero) b.esp+=5;
  // PUNTO GOL: 1pt by each goal scored by chosen player (×3 slots)
  const pgRealGoals = (realGoals.pg)||{};
  (p.pg||[]).forEach(player=>{
    if(!player) return;
    const g = findMatchingGoals(player, pgRealGoals);
    if(g) b.esp += g;
  });
  // TRIVIA NUMÉRICA: 5 preguntas x 5pts. Los que estén más cerca del valor real se llevan los 5.
  // Si hay empate en distancia mínima, los 5pts se reparten en partes iguales.
  const TRIV_KEYS = ['trivGoals','trivPenales','trivAmar','trivRojas','trivCorners'];
  TRIV_KEYS.forEach(k=>{
    const realVal = rsp[k];
    if(realVal==null || realVal==='') return;
    const myVal = sp[k];
    if(myVal==null || myVal==='') return;
    let minDist = Infinity, winnerCount = 0;
    Object.keys(preds).forEach(uname=>{
      const usp = (preds[uname].sp)||{};
      if(usp[k]==null || usp[k]==='') return;
      const d = Math.abs(parseFloat(usp[k]) - parseFloat(realVal));
      if(d<minDist){ minDist = d; winnerCount = 1; }
      else if(d===minDist){ winnerCount++; }
    });
    const myDist = Math.abs(parseFloat(myVal) - parseFloat(realVal));
    if(myDist===minDist && winnerCount>0) b.esp += 5/winnerCount;
  });
  // ---- GROUPS ----
  GROUP_LETTERS.forEach(grp=>{
    MATCHES.filter(m=>m.grp===grp).forEach(m=>{
      const pr = p.m && p.m[m.id];
      const rr = real.m[m.id];
      if(!pr||pr.h==null||pr.a==null||!rr||rr.h==null||rr.a==null) return;
      if(pr.h===rr.h && pr.a===rr.a) b.grp+=3;
      else if(Math.sign(pr.h-pr.a)===Math.sign(rr.h-rr.a)) b.grp+=1;
    });
    // positions bonus: +3 if predicted 1st and 2nd match real 1st/2nd; +1 extra if also 3rd
    const stReal = calcStandings(grp, realSrc);
    const stPred = calcStandings(grp, predSrc(name));
    const realDone = MATCHES.filter(m=>m.grp===grp).every(m=>realSrc(m.id));
    const predDone = MATCHES.filter(m=>m.grp===grp).every(m=>predSrc(name)(m.id));
    if(realDone && predDone){
      if(stReal[0].t===stPred[0].t && stReal[1].t===stPred[1].t){
        b.grp+=3;
        if(stReal[2].t===stPred[2].t) b.grp+=1;
      }
    }
  });
  // ---- R32 ----
  MATCHES.filter(m=>m.stg==='R32').forEach(m=>{
    const pr = p.m && p.m[m.id];
    const rr = real.m[m.id];
    if(!pr||pr.h==null||pr.a==null||!rr||rr.h==null||rr.a==null) return;
    if(pr.h===rr.h && pr.a===rr.a) b.r32+=3;
    else if(Math.sign(pr.h-pr.a)===Math.sign(rr.h-rr.a)) b.r32+=1;
    // bonus: +1 if predicted winner advances in real (real winner == predicted winner)
    const t1Real = resolveTeamReal(m.s1), t2Real = resolveTeamReal(m.s2);
    const t1Pred = resolveTeamPred(m.s1,name), t2Pred = resolveTeamPred(m.s2,name);
    if(t1Real&&t2Real&&t1Pred&&t2Pred){
      let realWin, predWin;
      if(rr.h>rr.a) realWin=t1Real; else if(rr.a>rr.h) realWin=t2Real; else realWin=(rr.ph>rr.pa?t1Real:t2Real);
      if(pr.h>pr.a) predWin=t1Pred; else if(pr.a>pr.h) predWin=t2Pred; else predWin=(pr.ph>pr.pa?t1Pred:t2Pred);
      if(realWin===predWin) b.r32+=1;
    }
  });
  // ---- R16/QF/SF/TP/FIN ----
  const koStages = {R16:'r16',QF:'qf',SF:'sf',TP:'sf',FIN:'fin'}; // TP & FIN both count in fin? Per spec: SF/FIN. Let's put TP in sf bucket since spec breakdown is SF·FIN.
  // Actually spec says columns: Total · ESP · GRP · R32 · OCT · CTO · SF · FIN. So OCT=R16, CTO=QF, SF=SF+TP, FIN=Final.
  const koBucket = {R16:'r16',QF:'qf',SF:'sf',TP:'sf',FIN:'fin'};
  MATCHES.filter(m=>['R16','QF','SF','TP','FIN'].includes(m.stg)).forEach(m=>{
    const pr = p.m && p.m[m.id];
    const rr = real.m[m.id];
    if(!pr||pr.h==null||pr.a==null||!rr||rr.h==null||rr.a==null) return;
    const bucket = koBucket[m.stg];
    // Winner: 2pts
    const t1Real = resolveTeamReal(m.s1), t2Real = resolveTeamReal(m.s2);
    const t1Pred = resolveTeamPred(m.s1,name), t2Pred = resolveTeamPred(m.s2,name);
    let realWin=null, predWin=null;
    if(t1Real&&t2Real){
      if(rr.h>rr.a) realWin=t1Real; else if(rr.a>rr.h) realWin=t2Real; else if(rr.ph!=null&&rr.pa!=null) realWin=(rr.ph>rr.pa?t1Real:t2Real);
    }
    if(t1Pred&&t2Pred){
      if(pr.h>pr.a) predWin=t1Pred; else if(pr.a>pr.h) predWin=t2Pred; else if(pr.ph!=null&&pr.pa!=null) predWin=(pr.ph>pr.pa?t1Pred:t2Pred);
    }
    if(realWin&&predWin&&realWin===predWin) b[bucket]+=2;
    // Exact score: 5pts (regular time)
    if(pr.h===rr.h && pr.a===rr.a) b[bucket]+=5;
    // Bonus +1 if predicted winner advances (only for non-final rounds where there's a next match)
    if(m.stg!=='FIN' && m.stg!=='TP'){
      if(realWin&&predWin&&realWin===predWin) b[bucket]+=1;
    }
  });
  return b;
}
function calcScore(name){
  const b = calcBreakdown(name);
  return b.esp+b.grp+b.r32+b.r16+b.qf+b.sf+b.fin;
}

// Debouncer ligero para no saturar Firebase con cada tecla
const writeTimers = {};
function debounceWrite(key, fn, delay=400){
  if(writeTimers[key]) clearTimeout(writeTimers[key]);
  writeTimers[key] = setTimeout(()=>{fn(); delete writeTimers[key]}, delay);
}
function setPred(id, key, val){
  const me = currentUser;
  if(!preds[me].m[id]) preds[me].m[id] = {h:null,a:null};
  const v = val===''?null:Math.max(0,Math.min(20,parseInt(val)));
  preds[me].m[id][key] = isNaN(v)?null:v;

function renderPredKORow(m, locked){
  const me = currentUser;
  const pr = (preds[me]&&preds[me].m&&preds[me].m[m.id])||{};
  const rr = real.m[m.id];
  const t1 = resolveSlotDisplay(m.s1, me);
  const t2 = resolveSlotDisplay(m.s2, me);
  const tagSrc = src=>src==='real'?'tag real':'tag pred';
  const renderSlot = (slot, td)=>{
    if(!td){
      const label = slot.startsWith('3:') ? `3° (de ${slot.slice(2).split('').join('/')})` : slot;
      return `<div class="t"><span class="muted">${label}</span></div>`;
    }
    const extra = slot.startsWith('3:') ? '<span class="tag muted">3°</span>' : '';
    // Si phase==ko Y el equipo real difiere de la predicción del usuario, mostrar "habías predicho"
    let origNote = '';
    if(td.source==='real' && isPhaseKO()){
      const origTeam = resolveTeamPred(slot, me);
      if(origTeam && origTeam !== td.team){
        origNote = `<div style="font-size:10px;color:var(--mute);width:100%;margin-top:2px">habías predicho: <b>${teamName(origTeam)}</b></div>`;
      }
    }

  };
  const showPens = (pr.h!=null && pr.a!=null && pr.h===pr.a);
  const cls = rr&&rr.h!=null ? 'match real' : 'match';
  const pts = matchPoints(me, m.id);
  return `<div class="${cls}">
    <div class="info">M${m.id}<br>${fmtDate(m.date)}</div>
    ${renderSlot(m.s1,t1)}
    <div class="score">
      <input type="number" min="0" max="20" value="${pr.h??''}" ${locked?'disabled':''} oninput="setPred(${m.id},'h',this.value)">
      <span>-</span>

      ${showPens?`<span class="pen">P:</span>

function groupSimilarPlayers(playerMap){
  const groups=[];
  for(const [pl,data] of Object.entries(playerMap)){
    let found=false;
    for(const group of groups){
      if(group.keys.some(k=>namesMatch(k,pl))){
        group.keys.push(pl); group.users.push(...data.users); found=true; break;
      }
    }
    if(!found) groups.push({keys:[pl],users:[...data.users]});
  }
  groups.forEach(g=>{g.canonical=g.keys.reduce((a,b)=>a.length>=b.length?a:b);});
  return groups;
}

        <div class="t"><img src="${flagUrl(m.t1)}" onerror="this.style.visibility='hidden'"><span>${teamName(m.t1)}</span></div>
        <div class="score">
          <input type="number" min="0" max="20" value="${rr.h??''}" oninput="setReal(${m.id},'h',this.value)">
          <span>-</span>
          <input type="number" min="0" max="20" value="${rr.a??''}" oninput="setReal(${m.id},'a',this.value)">
        </div>
        <div class="t right"><span>${teamName(m.t2)}</span><img src="${flagUrl(m.t2)}" onerror="this.style.visibility='hidden'"></div>
        <div></div>
      </div>`;
    });
    h += `</div><div id="std-real-admin-${grp}">${renderStandingsTable(st)}</div></div></div>`;
  });
  return h;
}
function setReal(id, key, val){
  if(!real.m[id]) real.m[id] = {h:null,a:null,ph:null,pa:null};
  const v = val===''?null:Math.max(0,Math.min(20,parseInt(val)));
  real.m[id][key] = isNaN(v)?null:v;
  debounceWrite('real_'+id, ()=>saveRealMatch(id));
  // Actualizar solo la tabla del grupo afectado (si es de grupo)
  const m = MATCH_BY_ID[id];
  if(m && m.grp){
    const el = document.getElementById('std-real-admin-'+m.grp);
    if(el){
      const st = calcStandings(m.grp, realSrc);
      el.innerHTML = renderStandingsTable(st);
    }
  }
}

function renderAdminKO(){
  let h = `<div class="card"><p class="muted" style="font-size:12px">Los equipos se resuelven automáticamente del bracket (incluyendo los 8 mejores 3° por puntos/DG/GF).</p></div>`;
  const stages = ['R32','R16','QF','SF','TP','FIN'];
  stages.forEach(stg=>{
    h += `<div class="card"><h3>${STAGE_LABEL[stg]}</h3>`;
    MATCHES.filter(m=>m.stg===stg).forEach(m=>{
      const rr = real.m[m.id]||{};
      const t1 = resolveTeamReal(m.s1), t2 = resolveTeamReal(m.s2);
      const label = (slot,team)=> team ? teamName(team) : (slot.startsWith('3:')?`3° (${slot.slice(2).split('').join('/')})`:slot);
      const showPens = (rr.h!=null && rr.a!=null && rr.h===rr.a);
      h += `<div class="match">
        <div class="info">M${m.id}<br>${fmtDate(m.date)}</div>
        <div class="t"><img src="${flagUrl(t1)}" onerror="this.style.visibility='hidden'"><span>${label(m.s1,t1)}</span></div>
        <div class="score">
          <input type="number" min="0" max="20" value="${rr.h??''}" oninput="setReal(${m.id},'h',this.value)">
          <span>-</span>
          <input type="number" min="0" max="20" value="${rr.a??''}" oninput="setReal(${m.id},'a',this.value)">
          ${showPens?`<span class="pen">P:</span>
            <input type="number" min="0" max="20" value="${rr.ph??''}" oninput="setReal(${m.id},'ph',this.value)" style="width:48px">
            <span>-</span>
            <input type="number" min="0" max="20" value="${rr.pa??''}" oninput="setReal(${m.id},'pa',this.value)" style="width:48px">`:''}
        </div>
        <div class="t right"><span>${label(m.s2,t2)}</span><img src="${flagUrl(t2)}" onerror="this.style.visibility='hidden'"></div>
        <div></div>
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

function renderAdminUsers(){
  let h = `<div class="card"><h3>Usuarios registrados (${Object.keys(users).length})</h3>`;
  if(Object.keys(users).length===0){h+=`<p class="muted">Sin usuarios todavía.</p>`}
  else {
    h += `<table><thead><tr><th>Nombre</th><th>Predicciones</th><th></th></tr></thead><tbody>`;
    Object.keys(users).forEach(n=>{
      const p = preds[n]||{};
      const cnt = p.m?Object.values(p.m).filter(x=>x.h!=null).length:0;
      h += `<tr><td><b>${n}</b></td><td>${cnt}/104 partidos</td><td><button class="btn danger" style="padding:4px 10px;font-size:12px" onclick="adminDelUser('${n.replace(/'/g,"\\'")}')">Borrar</button></td></tr>`;
    });
    h += `</tbody></table>`;
  }
  h += `</div>`;
  h += `<div class="card"><h3>Mantenimiento</h3>
    <button class="btn danger" onclick="adminClearReal()">Borrar resultados reales</button>
    <button class="btn danger" style="margin-left:8px" onclick="adminResetAll()">Reset total</button>
  </div>`;
  return h;
}
function adminDelUser(n){
  if(!confirm(`¿Borrar usuario "${n}" y sus predicciones?`)) return;
  deleteUser(n).then(()=>render());
}

let adminSelectedUser = '';
function setAdminSelectedUser(n){adminSelectedUser=n;render()}
function renderAdminPreds(){
  const names = Object.keys(users).sort();
  if(names.length===0) return `<div class="card"><p class="muted">No hay participantes registrados.</p></div>`;
  let h = '';
  // ============ RESUMEN GLOBAL ============
  h += `<div class="card"><h3>Resumen de predicciones especiales (todos los participantes)</h3>`;
  h += `<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr>
    <th>Participante</th>
    <th style="text-align:left">Campeón</th>
    <th style="text-align:left">Sub</th>
    <th style="text-align:left">3°</th>
    <th style="text-align:left">+ Goleador</th>
    <th style="text-align:left">+ Goleado</th>
    <th style="text-align:left">Goleador</th>
    <th style="text-align:left">Lesionado</th>
    <th style="text-align:left">Punto Gol</th>
    <th>Cargados</th>
  </tr></thead><tbody>`;
  names.forEach(n=>{
    const p = preds[n]||{};
    const sp = p.sp||{};
    const cnt = p.m?Object.values(p.m).filter(x=>x.h!=null && x.a!=null).length:0;
    const fmt = c => c ? `${flagImg(c,14)} ${teamName(c)}` : '<span class="muted">—</span>';
    const pgList = (p.pg||[]).filter(x=>x).join(', ') || '<span class="muted">—</span>';
    h += `<tr>
      <td><b>${n}</b></td>
      <td style="text-align:left">${fmt(sp.campeon)}</td>
      <td style="text-align:left">${fmt(sp.subcampeon)}</td>
      <td style="text-align:left">${fmt(sp.tercero)}</td>
      <td style="text-align:left">${fmt(sp.masGoleador)}</td>
      <td style="text-align:left">${fmt(sp.masGoleado)}</td>
      <td style="text-align:left">${sp.goleador||'<span class="muted">—</span>'}</td>
      <td style="text-align:left">${sp.lesionado||'<span class="muted">—</span>'}</td>
      <td style="text-align:left">${pgList}</td>
      <td>${cnt}/104</td>
    </tr>`;
  });
  h += `</tbody></table></div></div>`;

  // ============ DETALLE POR USUARIO ============
  h += `<div class="card"><h3>Ver predicciones detalladas de un participante</h3>
    <div class="row" style="margin-bottom:10px">
      <label>Participante:</label>
      <select onchange="setAdminSelectedUser(this.value)" style="min-width:200px">
        <option value="">— Elegí uno —</option>
        ${names.map(n=>`<option value="${n}" ${adminSelectedUser===n?'selected':''}>${n}</option>`).join('')}
      </select>
    </div>`;
  if(!adminSelectedUser || !users[adminSelectedUser]){h+=`</div>`;return h}
  const n = adminSelectedUser;
  const p = preds[n] || {m:{},sp:{},pg:[],t3:{}};
  const sp = p.sp||{};
  const b = calcBreakdown(n);
  const tot = b.esp+b.grp+b.r32+b.r16+b.qf+b.sf+b.fin;
  // Resumen de puntos
  h += `<div style="margin-bottom:14px;padding:10px;background:var(--panel2);border-radius:6px">
    <div style="font-size:13px;color:var(--mute);margin-bottom:4px">Puntos totales:</div>
    <div style="font-size:22px;font-weight:800;color:var(--acc2)">${fmtPts(tot)}</div>
    <div style="font-size:11px;color:var(--mute);margin-top:4px">
      ESP ${fmtPts(b.esp)} · GRP ${b.grp} · R32 ${b.r32} · OCT ${b.r16} · CTO ${b.qf} · SF ${b.sf} · FIN ${b.fin}
    </div>
  </div>`;
  // Especiales
  h += `<details open style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:600;padding:6px 0">Especiales</summary>
    <div class="adminlist" style="padding-left:10px">
      <div><b>Campeón:</b> ${sp.campeon?teamName(sp.campeon):'<span class="muted">—</span>'}</div>
      <div><b>Subcampeón:</b> ${sp.subcampeon?teamName(sp.subcampeon):'<span class="muted">—</span>'}</div>
      <div><b>3er puesto:</b> ${sp.tercero?teamName(sp.tercero):'<span class="muted">—</span>'}</div>
      <div><b>Más goleador:</b> ${sp.masGoleador?teamName(sp.masGoleador):'<span class="muted">—</span>'}</div>
      <div><b>Más goleado:</b> ${sp.masGoleado?teamName(sp.masGoleado):'<span class="muted">—</span>'}</div>
      <div><b>Más expulsados:</b> ${sp.masExpulsados?teamName(sp.masExpulsados):'<span class="muted">—</span>'}</div>
      <div><b>Goleador:</b> ${sp.goleador||'<span class="muted">—</span>'}</div>
      <div><b>Lesionado:</b> ${sp.lesionado||'<span class="muted">—</span>'}</div>
      <div><b>Punto Gol:</b> ${(p.pg||[]).filter(x=>x).join(', ')||'<span class="muted">—</span>'}</div>
    </div>
  </details>`;
  // Grupos
  h += `<details style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:600;padding:6px 0">Predicciones de grupo (72 partidos)</summary>`;
  GROUP_LETTERS.forEach(grp=>{
    const stPred = calcStandings(grp, predSrc(n));
    h += `<div style="margin:10px 0"><h4 style="margin:6px 0;font-size:13px">Grupo ${grp}</h4>`;
    h += `<table style="font-size:12px"><thead><tr><th>Partido</th><th>Pred</th><th>Real</th><th>Pts</th></tr></thead><tbody>`;
    MATCHES.filter(m=>m.grp===grp).forEach(m=>{
      const pr = (p.m&&p.m[m.id])||{};
      const rr = real.m[m.id]||{};
      const pts = matchPoints(n, m.id);
      h += `<tr>
        <td style="text-align:left">${teamName(m.t1)} vs ${teamName(m.t2)}</td>
        <td>${pr.h!=null?`${pr.h}-${pr.a}`:'<span class="muted">—</span>'}</td>
        <td>${rr.h!=null?`<b>${rr.h}-${rr.a}</b>`:'<span class="muted">—</span>'}</td>
        <td style="color:var(--acc2)">${pts?'+'+pts.total:''}</td>
      </tr>`;
    });
    h += `</tbody></table>`;
    h += `<div style="font-size:11px;color:var(--mute);margin-top:4px">Tabla predicha: ${stPred.map((r,i)=>`${i+1}° ${teamName(r.t)} (${r.pts}pts)`).join(' · ')}</div>`;
    h += `</div>`;
  });
  h += `</details>`;
  // Eliminatoria
  h += `<details style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:600;padding:6px 0">Predicciones de eliminatoria (32 partidos)</summary>`;
  const stages = ['R32','R16','QF','SF','TP','FIN'];
  stages.forEach(stg=>{
    const stgMatches = MATCHES.filter(m=>m.stg===stg);
    if(stgMatches.length===0) return;
    h += `<h4 style="margin:10px 0 4px 0;font-size:13px">${STAGE_LABEL[stg]}</h4>`;
    h += `<table style="font-size:12px"><thead><tr><th>M</th><th style="text-align:left">Cruce predicho</th><th>Marcador</th><th>Real</th><th>Pts</th></tr></thead><tbody>`;
    stgMatches.forEach(m=>{
      const pr = (p.m&&p.m[m.id])||{};
      const rr = real.m[m.id]||{};
      const t1p = resolveTeamPred(m.s1, n), t2p = resolveTeamPred(m.s2, n);
      const pts = matchPoints(n, m.id);
      const penPred = pr.h!=null&&pr.a!=null&&pr.h===pr.a&&pr.ph!=null?` (P${pr.ph}-${pr.pa})`:'';
      const penReal = rr.h!=null&&rr.a!=null&&rr.h===rr.a&&rr.ph!=null?` (P${rr.ph}-${rr.pa})`:'';
      h += `<tr>
        <td>M${m.id}</td>
        <td style="text-align:left">${t1p?teamName(t1p):m.s1} vs ${t2p?teamName(t2p):m.s2}</td>
        <td>${pr.h!=null?`${pr.h}-${pr.a}${penPred}`:'<span class="muted">—</span>'}</td>
        <td>${rr.h!=null?`<b>${rr.h}-${rr.a}${penReal}</b>`:'<span class="muted">—</span>'}</td>
        <td style="color:var(--acc2)">${pts?'+'+pts.total:''}</td>
      </tr>`;
    });
    h += `</tbody></table>`;
  });
  h += `</details>`;
  h += `</div>`;
  return h;
}
function adminClearReal(){
  if(!confirm('¿Borrar TODOS los resultados reales? (No afecta predicciones)')) return;
  clearReal().then(()=>render());
}
function adminResetAll(){
  if(!confirm('¿RESETEAR TODO? Borra usuarios, predicciones y resultados de la nube.')) return;
  clearAll().then(()=>{currentUser=null; saveSession(); location.reload()});
}
